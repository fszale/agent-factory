[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-factory"
version = "0.1.0"
description = "Config-driven runtime and deployment framework for hosting one or more digital twins."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pydantic>=2.8.0",
  "PyYAML>=6.0.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
agent-factory = "agent_factory.cli:main"

[tool.setuptools.packages.find]
include = ["agent_factory*"]
