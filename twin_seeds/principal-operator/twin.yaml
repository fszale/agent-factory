schema_version: "1.0"
twin_id: principal_operator
name: Principal Operator Twin
description: >
  A generic principal-operator digital twin seed for engineering leadership,
  strategic planning, and agent-factory design. This seed is intended to be
  combined with exported agent-kernel artifacts from a local folder or git source.
owner: Twin Owner
tags:
  - principal-operator
  - engineering
  - strategy
  - agent-factory
prompt:
  system_prompt: runtime/system.md
knowledge:
  documents:
    - knowledge/about.md
    - knowledge/principles.md
    - knowledge/factory.md
model_profiles:
  deep:
    provider: xai
    model: grok-4.20-0309-reasoning
    timeout_seconds: 3600
    store: false
    api_base: https://api.x.ai/v1
    api_key_env: XAI_API_KEY
  balanced:
    provider: xai
    model: grok-4.20-0309-reasoning
    timeout_seconds: 3600
    store: false
    api_base: https://api.x.ai/v1
    api_key_env: XAI_API_KEY
  fast:
    provider: stub
    model: stub-fast
    timeout_seconds: 5
default_model_profile: deep
channels:
  chat:
    enabled: true
    provider: http
    notes: Human-facing text chat interface.
  api:
    enabled: true
    provider: http
    notes: Programmatic JSON API for agents and workflows.
  voice:
    enabled: false
    provider: reserved
    notes: Reserved for later realtime speech integration.
  avatar:
    enabled: false
    provider: reserved
    notes: Reserved for later avatar rendering and session orchestration.
guardrails:
  autonomy_level: L1
  correction_required_for_self_modification: true
  allow_external_side_effects: false
  human_approval_required_actions:
    - promote_artifact_change
    - execute_external_side_effect
corrections:
  scopes:
    - response
    - task
    - artifact
    - identity
  promote_changes_via_review: true
evals:
  smoke_file: evals/smoke.yaml
